name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

env:
  AWS_REGION: eu-west-1

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: yarn typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn prettier:check

  test-cdk:
    runs-on: ubuntu-latest
    needs: [compile, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: CDK tests
        run: yarn test:cdk

  test-storybook:
    runs-on: ubuntu-latest
    needs: [compile, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction tests
        run: yarn test-storybook

  test-e2e:
    runs-on: ubuntu-latest
    needs: [compile, lint]
    # The suite creates and deletes data for the Cypress user in the dev backend, so never run two at once
    concurrency:
      group: e2e-dev-backend
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      NEXT_PUBLIC_STYTCH_PUBLIC_TOKEN: ${{ secrets.STYTCH_DEV_PUBLIC_TOKEN }}
      API_BASE_URL: https://api.home-automation.dev.andrewhurt.co.uk
      API_KEY: ${{ secrets.DEV_API_KEY }}
      STYTCH_PROJECT_ID: ${{ secrets.STYTCH_DEV_PROJECT_ID }}
      STYTCH_SECRET: ${{ secrets.STYTCH_DEV_SECRET }}
      CYPRESS_USER: ${{ secrets.CYPRESS_USER }}
      CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The backend builds the Cypress user's bellboard from this status message, so publish it
      # before the app build to give it time to be processed before the specs run
      - name: Seed Cypress bellboard
        env:
          CYPRESS_USER_ID: ${{ secrets.CYPRESS_USER_ID }}
        run: |
          aws iot-data publish --region "$AWS_REGION" \
            --topic "dev/$CYPRESS_USER_ID/hallwayboard/status" \
            --qos 1 \
            --cli-binary-format raw-in-base64-out \
            --payload file://cypress/fixtures/bellboards/hallwayboardStatus.json

      - name: Build app
        run: yarn build

      # The Cypress action's own wait-on gives up on some connection errors rather than retrying,
      # so start the server and wait for it here
      - name: Start app
        run: |
          yarn start > next-start.log 2>&1 &
          curl --silent --fail --output /dev/null --retry 60 --retry-delay 2 --retry-all-errors \
            http://localhost:3000/login

      - name: Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false

      - name: Show app server log
        if: failure()
        run: cat next-start.log || true

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [test-cdk, test-storybook, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy prod
        run: yarn deploy:prod
        env:
          # Inlined into the client bundle at build time
          NEXT_PUBLIC_STYTCH_PUBLIC_TOKEN: ${{ secrets.STYTCH_PROD_PUBLIC_TOKEN }}
          NEXT_PUBLIC_STYTCH_DOMAIN: https://thorn-angelfish-7819.customers.stytch.com
          API_KEY: ${{ secrets.PROD_API_KEY }}
          STYTCH_PROJECT_ID: ${{ secrets.STYTCH_PROD_PROJECT_ID }}
          STYTCH_SECRET: ${{ secrets.STYTCH_PROD_SECRET }}
