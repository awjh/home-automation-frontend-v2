name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

env:
  AWS_REGION: eu-west-1

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: yarn typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn prettier:check

  test-cdk:
    runs-on: ubuntu-latest
    needs: [compile, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: CDK tests
        run: yarn test:cdk

  test-storybook:
    runs-on: ubuntu-latest
    needs: [compile, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction tests
        run: yarn test-storybook

  test-e2e:
    runs-on: ubuntu-latest
    needs: [compile, lint]
    # The suite creates and deletes data for the Cypress user in the dev backend, so never run two at once
    concurrency:
      group: e2e-dev-backend
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_STYTCH_PUBLIC_TOKEN: ${{ secrets.STYTCH_DEV_PUBLIC_TOKEN }}
      API_BASE_URL: https://api.home-automation.dev.andrewhurt.co.uk
      API_KEY: ${{ secrets.DEV_API_KEY }}
      STYTCH_PROJECT_ID: ${{ secrets.STYTCH_DEV_PROJECT_ID }}
      STYTCH_SECRET: ${{ secrets.STYTCH_DEV_SECRET }}
      CYPRESS_USER: ${{ secrets.CYPRESS_USER }}
      CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          build: yarn build
          start: yarn start
          wait-on: http://localhost:3000/login
          wait-on-timeout: 120

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [test-cdk, test-storybook, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy prod
        run: yarn deploy:prod
        env:
          # Inlined into the client bundle at build time
          NEXT_PUBLIC_STYTCH_PUBLIC_TOKEN: ${{ secrets.STYTCH_PROD_PUBLIC_TOKEN }}
          API_KEY: ${{ secrets.PROD_API_KEY }}
          STYTCH_PROJECT_ID: ${{ secrets.STYTCH_PROD_PROJECT_ID }}
          STYTCH_SECRET: ${{ secrets.STYTCH_PROD_SECRET }}
